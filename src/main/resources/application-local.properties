# Perfil opcional "local" - vuelve a habilitar la consola H2 (deshabilitada por
# defecto en application.properties, ver el comentario ahi) para poder
# inspeccionar el log de trazabilidad corriendo el PoC en tu propia maquina.
#
# La ruta /h2-console queda con acceso publico, sin autenticacion propia, en
# SecurityConfig.java - esto le da a quien la alcance SQL arbitrario sobre toda
# la base (incluido pacs008Xml/pacs002Xml sin enmascarar) y, via H2
# "CREATE ALIAS ... AS $$ ... $$", ejecucion de codigo Java en el proceso.
#
# NUNCA actives este perfil en un entorno alcanzable desde una red que no sea
# de confianza (ni en un contenedor/VM expuesto, ni en un host con el puerto
# reenviado) - solo para correr el PoC en localhost, en tu propia maquina.
#
# Uso:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local

spring.h2.console.enabled=true
