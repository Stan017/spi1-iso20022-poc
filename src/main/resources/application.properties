spring.application.name=spi1-iso20022-poc

# H2 embebido en memoria (ver Capa 3 / Auditoria: decision confirmada)
spring.datasource.url=jdbc:h2:mem:spi1poc;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2 DESHABILITADA por defecto - la ruta /h2-console no requiere
# autenticacion (ver SecurityConfig.java) y expone SQL arbitrario sobre toda
# la base, incluyendo pacs008Xml/pacs002Xml sin enmascarar. Para inspeccionarla
# localmente, correr con el perfil "local" (ver application-local.properties)
# y NUNCA en un entorno alcanzable desde una red que no sea de confianza.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

server.port=8080

logging.level.com.stan.poc.spi2iso=INFO
# El filtro JWT y el InMemoryUserDetailsManager por defecto de Spring Boot son ruidosos en DEBUG; INFO basta para la demo.
logging.level.org.springframework.security=INFO

# --- Seguridad (Capa 4) ---------------------------------------------------------
# Secreto HS256 de demo para firmar/validar tokens (ver JwtService). En un entorno
# real esto vendria de un vault/secret manager, nunca en texto plano en el repo, y
# la firma seria asimetrica (RS256/ES256) con rotacion via JWKS.
poc.security.jwt.secret=cambia-este-secreto-de-demo-por-uno-real-de-al-menos-32-caracteres
poc.security.jwt.issuer=spi1-iso20022-poc-authz-sim
poc.security.jwt.ttl-seconds=900

# Cliente OAuth2 "client_credentials" de demo (ver ClientRegistry / TokenController).
poc.security.oauth.demo-client-id=banco-pichincha-poc-client
poc.security.oauth.demo-client-secret=demo-secret-cambiar-en-uso-real

# --- Swagger UI / OpenAPI ---------------------------------------------------
# Disponible en http://localhost:8080/swagger-ui.html sin autenticacion.
# La spec JSON esta en /v3/api-docs.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
