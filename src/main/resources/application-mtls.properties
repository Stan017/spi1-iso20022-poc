# Perfil opcional "mtls" - demuestra como se configuraria mTLS (autenticacion mutua
# por certificado X.509) en Spring Boot para el canal API Gateway <-> switch del BCE,
# tal como quedo documentado en la Capa 4 (Seguridad) del diseno del PoC.
#
# NO se activa por defecto porque requiere generar primero un keystore y un truststore
# de demo: correr scripts/generar-certificados-mtls.sh (genera certificados AUTOFIRMADOS,
# solo para esta demo local - nunca usar certificados autofirmados en produccion).
#
# Para activarlo:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mtls
# y llamar a la API por HTTPS en https://localhost:8443 presentando el certificado de
# cliente generado por el script (certs/cliente.p12).
#
# Limite de este PoC: esto configura mTLS a nivel de transporte (Spring Boot/Tomcat).
# No implementa la logica de autorizacion por certificado (mapear el Subject del
# certificado del cliente a un client_id/scopes) - en este PoC esa autorizacion sigue
# viviendo en el flujo OAuth2/JWT de SecurityConfig. En una integracion real con el BCE,
# ambos mecanismos (mTLS a nivel de canal + OAuth2/JWT a nivel de aplicacion) conviven:
# mTLS asegura que solo participantes autorizados de la red de pagos puedan abrir la
# conexion; el token OAuth2 identifica la operacion/alcance dentro de esa conexion.

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:certs/servidor.p12
server.ssl.key-store-password=cambia-esta-clave-de-demo
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=servidor

# client-auth=need obliga a que el cliente presente un certificado valido (mTLS real,
# no solo TLS del lado del servidor).
server.ssl.client-auth=need
server.ssl.trust-store=classpath:certs/truststore.p12
server.ssl.trust-store-password=cambia-esta-clave-de-demo
server.ssl.trust-store-type=PKCS12
